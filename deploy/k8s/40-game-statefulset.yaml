# Authoritative game world — SINGLE replica (DuckDB + in-memory WorldServer).
# HA strategy: dual cloudflared + PDB + graceful restarts + launchd/docker fallback.
# Scaling replicas >1 requires shared multi-writer DB (not DuckDB file).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grokhack-game
  namespace: grokhack
  labels:
    app: grokhack
    tier: game
spec:
  serviceName: grokhack
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: grokhack
      tier: game
  template:
    metadata:
      labels:
        app: grokhack
        tier: game
    spec:
      terminationGracePeriodSeconds: 105
      securityContext:
        fsGroup: 1000
      containers:
        - name: grokhack
          image: grokhack:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: grokhack-config
            - secretRef:
                name: grokhack-env
                optional: true
          env:
            # Must listen on all interfaces in-cluster (secret .env often has BIND_HOST=127.0.0.1 for Mac)
            - name: BIND_HOST
              value: "0.0.0.0"
            # Never inherit 0.0.0.0 for telnet (cluster-lateral risk)
            - name: TELNET_BIND_HOST
              value: "127.0.0.1"
            - name: PORT
              value: "8080"
          volumeMounts:
            - name: data
              mountPath: /app/data
          lifecycle:
            preStop:
              exec:
                # Let CF drain; flush handled by SIGTERM in server
                command: ["/bin/sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grokhack-data
---
apiVersion: v1
kind: Service
metadata:
  name: grokhack
  namespace: grokhack
  labels:
    app: grokhack
spec:
  selector:
    app: grokhack
    tier: game
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
# Prevent voluntary eviction of the only game pod without replacement ready
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grokhack-game-pdb
  namespace: grokhack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: grokhack
      tier: game
