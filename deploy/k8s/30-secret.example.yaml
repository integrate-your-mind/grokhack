# Copy to 30-secret.yaml (gitignored) or create with:
#   kubectl -n grokhack create secret generic grokhack-env --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: grokhack-env
  namespace: grokhack
type: Opaque
stringData:
  # Required for live x402 accepts[] — your hardware wallet
  X402_PAY_TO: "0x0E4d1C7Ca47879C7Dd518526ef38f290C7081028"
  GROKHACK_TREASURY_ADDRESS: "0x0E4d1C7Ca47879C7Dd518526ef38f290C7081028"
  # Optional facilitator for settle
  # THIRDWEB_SECRET_KEY: ""
  # X402_FACILITATOR_URL: "https://api.thirdweb.com/v1/x402"
  # Discord / IRC — paste from local .env
  # DISCORD_BOT_TOKEN: ""
  # DISCORD_GUILD_ID: ""
  IRC_ENABLED: "1"
  IRC_CHANNEL: "#grokhack"
