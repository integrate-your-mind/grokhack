# Optional edge-ish static cache in-cluster (Cloudflare still primary CDN).
# Serves public/ from a replica set — useful if you later split static from game WS.
# Disabled by default: game already serves public/ from the StatefulSet.
# Apply when you want extra static redundancy:
#   kubectl apply -f 60-static-cache.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grokhack-nginx-cache
  namespace: grokhack
  annotations:
    description: "Optional — not required for core HA"
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static:10m max_size=100m inactive=60m;
      server {
        listen 8081;
        location / {
          proxy_pass http://grokhack:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          # Cache only static-ish GETs
          proxy_cache static;
          proxy_cache_valid 200 1m;
          proxy_cache_methods GET HEAD;
          add_header X-Cache-Status $upstream_cache_status;
        }
      }
    }
