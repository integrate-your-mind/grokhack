name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            edge/package-lock.json
            mcp/package-lock.json

      - name: Install tmux fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          tmux -V

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix edge
          npm ci --prefix mcp

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate --prefix edge
          npm audit --omit=dev --audit-level=moderate --prefix mcp

      - name: Lint correctness rules
        run: npm run lint

      - name: Test root runtime
        run: npm run test:coverage

      - name: Test root runtime in deterministic shuffled order
        run: npm test -- --sequence.shuffle --sequence.seed=20260710

      - name: Run deterministic journal and catch-up properties
        run: npm run test:property

      - name: Prove origin journal to local Workers shadow parity
        run: npm run test:shadow-e2e

      - name: Build browser client
        run: npm run build

      - name: Enforce exact server type-debt baseline
        run: npm run check:server-types

      - name: Verify Cloudflare edge runtime
        run: npm run edge:verify

      - name: Build MCP package
        run: npm --prefix mcp run build
